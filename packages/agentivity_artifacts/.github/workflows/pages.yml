name: Deploy showcase to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Flutter web showcase
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ── Add web support ───────────────────────────────────────────────────────

      - name: Enable web — example
        working-directory: example
        run: flutter create --platforms web . --project-name example

      # ── Build ─────────────────────────────────────────────────────────────────

      - name: Build example
        working-directory: example
        run: |
          flutter pub get
          flutter build web --release \
            --base-href /agentivity_artifacts/example/

      # ── Assemble site ─────────────────────────────────────────────────────────

      - name: Assemble site
        run: |
          mkdir -p _site
          cp doc/index.html             _site/index.html
          cp -r example/build/web       _site/example

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
