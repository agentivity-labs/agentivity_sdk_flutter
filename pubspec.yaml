name: agentivity_sdk
description: >-
  The Flutter/Dart SDK for building applications against the Agentivity platform:
  a real-time AG-UI-protocol client, generative-content widgets, and a platform
  API client. For building new apps and integrations — not for administering the
  platform (creating/editing workflows, agents, teams, or credentials stays
  inside Agentivity Studio).
version: 0.1.0
repository: https://github.com/agentivity-labs/agentivity_sdk_flutter
homepage: https://labs.agentivity.io/agentivity_sdk/
issue_tracker: https://github.com/agentivity-labs/agentivity_sdk_flutter/issues

environment:
  sdk: ">=3.7.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.5.0
  meta: ^1.15.0
  flutter_markdown_plus: ^1.0.7
  file_picker: ^11.0.2
  desktop_drop: ^0.7.1
  speech_to_text: ^7.4.0
  record: ^7.0.0
  super_clipboard: ^0.9.1
  fl_chart: ^1.2.0
  flutter_svg: ^2.0.10+1
  flutter_math_fork: ^0.7.2
  flutter_highlight: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  fake_async: ^1.3.1
  test: ^1.25.0
